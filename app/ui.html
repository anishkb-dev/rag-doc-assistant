<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Assistant</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#1d1d1b; --muted:#6b6b66; --line:#e3e3de; --accent:#2f5d50; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --card:#1f1f1d; --text:#ececea; --muted:#a3a39d; --line:#33332f; --accent:#7fb8a6; } }
  * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 system-ui, sans-serif; }
  main { max-width:820px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:22px; margin:0 0 4px } .sub { color:var(--muted); margin:0 0 24px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center }
  input[type=text], select { flex:1; min-width:200px; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer } button:disabled { opacity:.5 }
  .docs span { display:inline-block; padding:3px 10px; margin:4px 6px 0 0; border:1px solid var(--line); border-radius:99px; font-size:13px; cursor:pointer }
  #answer { white-space:pre-wrap } .cite { font-size:13px; color:var(--muted); border-left:3px solid var(--line); padding:4px 10px; margin-top:10px }
  .cite b { color:var(--text) } .muted { color:var(--muted); font-size:13px }
</style>
</head>
<body><main>
  <h1>Document Assistant</h1>
  <p class="sub">Upload PDF, Word or Excel files and ask questions. Every answer cites where it came from.</p>

  <div class="card">
    <div class="row"><input type="file" id="file" multiple accept=".pdf,.docx,.xlsx,.xlsm,.txt,.md"><button id="up">Upload</button></div>
    <div class="docs" id="docs"></div>
    <p class="muted">Click a document to summarize it.</p>
  </div>

  <div class="card">
    <div class="row">
      <input type="text" id="q" placeholder="e.g. How many days of annual leave do employees get?">
      <select id="src"><option value="">All documents</option></select>
      <button id="ask">Ask</button>
    </div>
  </div>

  <div class="card" id="out" hidden><div id="answer"></div><div id="cites"></div></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function loadDocs() {
  const { documents } = await (await fetch('/documents')).json();
  $('docs').innerHTML = documents.map(d => `<span data-d="${esc(d)}">${esc(d)}</span>`).join('');
  $('src').innerHTML = '<option value="">All documents</option>' + documents.map(d => `<option>${esc(d)}</option>`).join('');
}
function show(text, cites = []) {
  $('out').hidden = false; $('answer').textContent = text;
  $('cites').innerHTML = cites.map(c => `<div class="cite"><b>[${c.n}] ${esc(c.source)}, ${esc(c.location)}</b><br>${esc(c.excerpt)}…</div>`).join('');
}
$('up').onclick = async () => {
  $('up').disabled = true;
  for (const f of $('file').files) {
    const fd = new FormData(); fd.append('file', f);
    const r = await fetch('/documents', { method:'POST', body:fd });
    if (!r.ok) show((await r.json()).detail);
  }
  $('up').disabled = false; loadDocs();
};
$('ask').onclick = async () => {
  if (!$('q').value.trim()) return;
  $('ask').disabled = true; show('Thinking…');
  const r = await fetch('/ask', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ question:$('q').value, source:$('src').value || null }) });
  const j = await r.json(); show(j.answer ?? j.detail, j.citations); $('ask').disabled = false;
};
$('q').onkeydown = e => { if (e.key === 'Enter') $('ask').click(); };
$('docs').onclick = async e => {
  const d = e.target.dataset.d; if (!d) return;
  show(`Summarizing ${d}…`);
  const j = await (await fetch(`/documents/${encodeURIComponent(d)}/summary`, { method:'POST' })).json();
  show(j.summary ?? j.detail);
};
loadDocs();
</script>
</body></html>
